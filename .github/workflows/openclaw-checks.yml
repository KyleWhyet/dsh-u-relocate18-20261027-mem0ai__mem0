name: openclaw checks

# On PRs this is invoked by ci-gate.yml (the single required check);
# push-to-main and manual runs remain standalone.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'integrations/openclaw/**'
      - '.github/workflows/openclaw-checks.yml'
  workflow_call:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: integrations/openclaw/pnpm-lock.yaml

      - name: Install dependencies
        run: cd integrations/openclaw && pnpm install --frozen-lockfile

      - name: Type check
        run: cd integrations/openclaw && pnpm exec tsc --noEmit

  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: true
      matrix:
        node-version: [20, 22]
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'
          cache-dependency-path: integrations/openclaw/pnpm-lock.yaml

      - name: Install dependencies
        run: cd integrations/openclaw && pnpm install --frozen-lockfile

      - name: Run tests with coverage
        run: cd integrations/openclaw && pnpm exec vitest run --coverage

      - name: Upload coverage to Codecov
        if: matrix.node-version == 20
        uses: codecov/codecov-action@fb8b3582c8e4def4969c97caa2f19720cb33a72f # v7.0.0
        with:
          flags: openclaw
          directory: integrations/openclaw/coverage
        env:
          CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 20
          cache: 'pnpm'
          cache-dependency-path: integrations/openclaw/pnpm-lock.yaml

      - name: Install dependencies
        run: cd integrations/openclaw && pnpm install --frozen-lockfile

      - name: Build
        run: cd integrations/openclaw && pnpm build

      - name: Verify dist output exists
        run: |
          missing=0
          for file in integrations/openclaw/dist/index.js integrations/openclaw/dist/index.d.ts; do
            if [ ! -f "$file" ]; then
              echo "Build output missing: $file"
              missing=1
            fi
          done
          exit "$missing"
